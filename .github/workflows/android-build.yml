name: Android CI / Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Debug Keystore & Environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Extract Commit Info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=%an)
          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "### 🚀 Auto Build Details" >> $GITHUB_STEP_SUMMARY
          echo "**Commit Hash:** \`$COMMIT_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** $AUTHOR" >> $GITHUB_STEP_SUMMARY
          echo "**Commit Message:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "$COMMIT_MSG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Unit Tests
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: ./gradlew test --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOCUS_OS_debug_apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
