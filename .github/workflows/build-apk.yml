name: Build Custom APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: |
        VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | awk -F '"' '{print $2}')
        DATE=$(date +'%d-%b-%Y_%H-%M-%S')
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FocusOS_v${VERSION_NAME}_${DATE}.apk
        echo "APK_NAME=FocusOS_v${VERSION_NAME}_${DATE}.apk" >> $GITHUB_ENV

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APK_NAME }}
        path: app/build/outputs/apk/debug/FocusOS_*.apk
